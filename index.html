    <!-- PWA bootstrap — runs synchronously before first paint.
         1. Injects the correct manifest link based on the current path so
            Chrome/Safari reads the right manifest at install time.
         2. Overrides iOS meta tags for the admin context.
         3. Marks standalone mode so CSS and JS agree without a race condition. -->
    <script>
      (function () {
        // ── Direction bootstrap — runs before first paint ─────────────────
        // Read the saved language from localStorage and set the html dir
        // attribute immediately so the first render is already in the right direction.
        // Default: 'ar' (RTL) for new users — the app's primary audience.
        var savedLang = localStorage.getItem('lang');
        var isRtl = !savedLang || savedLang === 'ar';
        document.documentElement.dir  = isRtl ? 'rtl' : 'ltr';
        document.documentElement.lang = savedLang || 'ar';

        var isAdmin = window.location.pathname.indexOf('/tero-hq') === 0;

        // ── Manifest injection ──────────────────────────────────────────
        // Do NOT use a static <link rel="manifest"> — the browser reads it
        // before any script can swap it. Create it here so the correct file
        // is fetched from the very first document parse.
        var mf = document.createElement('link');
        mf.rel  = 'manifest';
        mf.href = isAdmin ? '/tero-hq-manifest.json' : '/manifest.json';
        document.head.appendChild(mf);

        // ── Admin context: override iOS / Android meta tags ─────────────
        if (isAdmin) {
          var titleMeta = document.getElementById('meta-ios-title');
          if (titleMeta) titleMeta.setAttribute('content', 'TERO HQ');
          var appNameMeta = document.getElementById('meta-app-name');
          if (appNameMeta) appNameMeta.setAttribute('content', 'TERO HQ');
          var themeMeta = document.getElementById('meta-theme-color');
          if (themeMeta) themeMeta.setAttribute('content', '#1a3a4a');
          document.documentElement.classList.add('admin-context');
        }

        // ── Standalone mode detection ───────────────────────────────────
        if (
          window.navigator.standalone === true ||
          window.matchMedia('(display-mode: standalone)').matches
        ) {
          document.documentElement.classList.add('pwa-standalone');
        }
      })();
    </script>
